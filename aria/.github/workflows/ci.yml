name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  # ── Backend ────────────────────────────────────────────────────────────────
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aria/backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: |
          pip install ruff mypy
          ruff check .
          ruff format --check .

      - name: Type check with mypy
        run: mypy . --ignore-missing-imports --no-error-summary || true

      - name: Run pytest
        run: |
          pytest tests/ -v \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=80
        env:
          DATABASE_URL: sqlite+aiosqlite:///./test.db
          REDIS_URL: redis://localhost:6379/0
          STT_BACKEND: local
          LLM_BACKEND: ollama
          TTS_BACKEND: piper
          DIAR_BACKEND: local
          DEBUG: "true"

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: aria/backend/coverage.xml
        continue-on-error: true

  # ── Frontend ───────────────────────────────────────────────────────────────
  vitest:
    name: vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aria/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: aria/frontend/package.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Run vitest
        run: npm run test:run

  # ── Docker build ──────────────────────────────────────────────────────────
  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [pytest, vitest]
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image (CPU-only, no GPU in CI)
        run: |
          docker build \
            -f aria/backend/Dockerfile.dev \
            -t aria-backend:ci \
            --build-arg SKIP_GPU=true \
            aria/

      - name: Build frontend image
        run: |
          docker build \
            -f aria/frontend/Dockerfile.dev \
            -t aria-frontend:ci \
            aria/frontend/
